// Star Citizen 5.0 PTU (5.0.202.205) - reconstructed from embedded
// FileDescriptorProto in Bin64/StarCitizen.exe (sc/game/telemetry/v1/api.proto)
syntax = "proto3";
package sc.game.telemetry.v1;

import "sc/game/telemetry/v1/types.proto";

enum TriggerGameActionStatus {
  TRIGGER_GAME_ACTION_STATUS_UNSPECIFIED = 0;
  TRIGGER_GAME_ACTION_STATUS_OK = 1;
  TRIGGER_GAME_ACTION_STATUS_UNKNOWN_ACTION = 2;
  TRIGGER_GAME_ACTION_STATUS_MAP_INACTIVE = 3;
  TRIGGER_GAME_ACTION_STATUS_RATE_LIMITED = 4;
  TRIGGER_GAME_ACTION_STATUS_FAILED = 5;
  TRIGGER_GAME_ACTION_STATUS_HOLD_NOT_ALLOWED = 6;
  TRIGGER_GAME_ACTION_STATUS_FILTERED = 7;
}

message TelemetryStreamRequest {
  // empty - server pushes frames at its configured interval
  // (server-game-telemetry-stream-interval-ms, default ~50 ms = 20 Hz)
}

message TelemetryStreamResponse {
  // field 1, 2 removed in development
  VehicleFrame vehicle = 3;              // present when seated in / flying a vehicle
  WeaponsFrame weapons = 4;              // present when piloting a vehicle
  EventsFrame events = 5;                // discrete game events
  ActorFrame actor = 6;                  // always present (local player)
  ForceFeedbackFrame force_feedback = 7; // motion/haptic data
  TurretFrame turret = 8;                // when in a turret
}

message TriggerGameActionRequest {
  string action_name = 1;   // from ListTriggerableActions / allowlist
  optional uint32 hold_ms = 2;  // hold duration for holdable actions
}

message TriggerGameActionResponse {
  TriggerGameActionStatus status = 1;
  string message = 2;
}

message ListTriggerableActionsRequest {
}

message TriggerableAction {
  string action_name = 1;
  string category = 2;
  bool holdable = 3;
}

message ListTriggerableActionsResponse {
  repeated TriggerableAction actions = 1;
}

service GameTelemetryService {
  // Server-streaming: open a stream, receive TelemetryStreamResponse frames.
  rpc TelemetryStream (TelemetryStreamRequest) returns (stream TelemetryStreamResponse);
  // Fire an allowlisted game action from an external client (MFD buttons!).
  rpc TriggerGameAction (TriggerGameActionRequest) returns (TriggerGameActionResponse);
  // Enumerate the allowlisted actions.
  rpc ListTriggerableActions (ListTriggerableActionsRequest) returns (ListTriggerableActionsResponse);
}
